openapi: 3.1.0
info:
  title: ForgeERP API
  version: 0.1.0
  description: >
    ForgeERP modernized ERP/CRM API (Dolibarr functional successor).
    This document is authoritative for REST surface; phase routers must register
    every path declared here.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
                  commit: { type: string }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (includes DB check)
      responses:
        '200': { description: Ready }
        '503': { description: Degraded }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with native credentials (Dolibarr functions_dolibarr.php equivalent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
                entity_id: { type: integer, default: 1 }
      responses:
        '200': { description: Access + refresh tokens }
        '401': { description: Invalid credentials, locked, or disabled }
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate an opaque refresh token (single-use)
      responses:
        '200': { description: New token pair }
        '401': { description: Invalid refresh token }
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      responses:
        '204': { description: Revoked }
  /api/v1/auth/me:
    get:
      operationId: me
      summary: Authenticated user profile (requires identity.user.read)
      responses:
        '200': { description: Profile }
        '401': { description: Unauthorized }
        '403': { description: Missing right }
  /api/v1/users:
    post:
      operationId: createUser
      summary: Register a native account (requires identity.user.write)
      responses:
        '201': { description: Created }
        '403': { description: Missing right }
  /api/v1/groups:
    post:
      operationId: createGroup
      summary: Create a rights group (requires identity.group.write)
      responses:
        '201': { description: Created }
  /api/v1/rights/grant:
    post:
      operationId: grantRight
      summary: Issue one module.entity.action triple (requires identity.right.write)
      responses:
        '204': { description: Granted }
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: Page organizations in caller's entity (requires partners.organization.read)
      responses:
        '200': { description: List }
        '403': { description: Missing right }
    post:
      operationId: createOrganization
      summary: Create a third party (requires partners.organization.write)
      responses:
        '201': { description: Created }
        '409': { description: Duplicate code }
        '422': { description: Validation failed }
  /api/v1/organizations/{id}:
    get:
      operationId: getOrganization
      summary: Fetch one organization
      responses:
        '200': { description: Organization }
        '404': { description: Not found }
  /api/v1/categories:
    post:
      operationId: createCategory
      summary: Create a tag category (requires partners.category.write)
      responses:
        '201': { description: Created }
  /api/v1/products:
    get:
      operationId: listProducts
      summary: Page products (requires catalog.product.read)
      responses:
        '200': { description: List }
    post:
      operationId: createProduct
      summary: Create a product (requires catalog.product.write)
      responses:
        '201': { description: Created }
        '409': { description: Duplicate SKU }
        '422': { description: Validation failed }
  /api/v1/warehouses:
    post:
      operationId: createWarehouse
      summary: Open a warehouse (requires catalog.warehouse.write)
      responses:
        '201': { description: Created }
  /api/v1/stock-movements:
    post:
      operationId: appendMovement
      summary: Record a stock movement (requires catalog.stock.write)
      responses:
        '201': { description: Created with new level }
        '422': { description: Guard violation (e.g. oversell) }
  /api/v1/stock-levels:
    get:
      operationId: getStockLevel
      summary: On-hand position with PMP valuation (requires catalog.stock.read)
      responses:
        '200': { description: Level + PMP }
  /api/v1/inventory-adjust:
    post:
      operationId: inventoryAdjust
      summary: Post an inventory-count correction (requires catalog.stock.write)
      responses:
        '201': { description: Created }
  /api/v1/sales/documents:
    get:
      operationId: listSalesDocuments
      summary: Page commercial documents by type (requires sales.document.read)
      responses:
        '200': { description: List }
    post:
      operationId: createSalesDocument
      summary: Create a draft document (requires sales.document.write)
      responses:
        '201': { description: Created with server ref + totals }
        '422': { description: Validation failed }
  /api/v1/sales/documents/{id}/status:
    post:
      operationId: setDocumentStatus
      summary: Kernel-checked status transition (requires sales.document.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/sales/documents/{id}/convert:
    post:
      operationId: convertDocument
      summary: Clone into next family with lineage (requires sales.document.write)
      responses:
        '201': { description: Converted }
        '422': { description: Illegal conversion }
  /api/v1/sales/payments:
    post:
      operationId: recordPayment
      summary: Record + allocate a payment (requires sales.payment.write)
      responses:
        '201': { description: Recorded with allocation }
        '422': { description: Overpayment refused }
  /api/v1/sales/shipments/{id}/fulfill:
    post:
      operationId: fulfillShipment
      summary: Post stock shipments for a validated shipment (requires sales.shipment.write)
      responses:
        '200': { description: Fulfilled, shipment closed }
        '422': { description: Guard violation }
  /api/v1/purchase/documents:
    get:
      operationId: listPurchaseDocuments
      summary: Page supplier documents by type (requires procurement.document.read)
      responses:
        '200': { description: List }
    post:
      operationId: createPurchaseDocument
      summary: Create a draft supplier document with contract-price check (requires procurement.document.write)
      responses:
        '201': { description: Created }
        '422': { description: Off-contract price or validation failure }
  /api/v1/purchase/documents/{id}/approve:
    post:
      operationId: approvePurchaseOrder
      summary: Stamp approval for above-threshold orders (requires procurement.document.write)
      responses:
        '200': { description: Approved }
  /api/v1/purchase/prices:
    post:
      operationId: upsertSupplierPrice
      summary: Pin a contract price (requires procurement.price.write)
      responses:
        '201': { description: Pinned }
  /api/v1/purchase/payments:
    post:
      operationId: recordSupplierPayment
      summary: Record + allocate a supplier payment (requires procurement.payment.write)
      responses:
        '201': { description: Recorded }
  /api/v1/purchase/receptions/{id}/receive:
    post:
      operationId: receiveReception
      summary: Post stock receipts for a validated reception (requires procurement.reception.write)
      responses:
        '200': { description: Received, reception closed }
  /api/v1/finance/accounts:
    post:
      operationId: createAccount
      summary: Add a chart-of-accounts row (requires finance.account.write)
      responses:
        '201': { description: Created }
  /api/v1/finance/entries:
    post:
      operationId: postEntry
      summary: Validate, chain-link and post an entry (requires finance.entry.write)
      responses:
        '201': { description: Posted }
        '422': { description: Unbalanced or locked year }
  /api/v1/finance/trial-balance:
    get:
      operationId: trialBalance
      summary: Per-account sums with balance assertion (requires finance.entry.read)
      responses:
        '200': { description: Balanced trial balance }
  /api/v1/finance/chain-verify:
    get:
      operationId: verifyChain
      summary: Recompute the tamper-evident chain (requires finance.entry.read)
      responses:
        '200': { description: Chain verdict }
  /api/v1/finance/bank-transactions:
    post:
      operationId: recordBankTransaction
      summary: Record a bank movement (requires finance.bank.write)
      responses:
        '201': { description: Recorded }
  /api/v1/documents/upload:
    post:
      operationId: uploadDocument
      summary: Upload a file with metadata (requires documents.file.write)
      responses:
        '201': { description: Stored }
        '422': { description: Validation failed }
  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: List file metadata (requires documents.file.read)
      responses:
        '200': { description: List }
  /api/v1/search:
    get:
      operationId: search
      summary: Cross-entity substring search (requires search.query.read)
      responses:
        '200': { description: Hits }
  /api/v1/services/projects:
    get:
      operationId: listProjects
      summary: Page projects (requires services.project.read)
      responses:
        '200': { description: List }
    post:
      operationId: createProject
      summary: Open a draft project (requires services.project.write)
      responses:
        '201': { description: Created }
        '409': { description: Duplicate ref }
        '422': { description: Validation failed }
  /api/v1/services/projects/{id}/status:
    post:
      operationId: setProjectStatus
      summary: State-machine transition for a project (requires services.project.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/services/projects/{id}/tasks:
    get:
      operationId: listProjectTasks
      summary: List a project's tasks (requires services.task.read)
      responses:
        '200': { description: List }
    post:
      operationId: createProjectTask
      summary: Add a task to an open project (requires services.task.write)
      responses:
        '201': { description: Created }
        '422': { description: Project closed or invalid }
  /api/v1/services/tasks/{id}/time:
    post:
      operationId: bookTime
      summary: Book hours against an open task (requires services.time.write)
      responses:
        '201': { description: Booked }
        '422': { description: Task or project closed }
  /api/v1/services/contracts:
    post:
      operationId: createServiceContract
      summary: Open a draft service contract (requires services.contract.write)
      responses:
        '201': { description: Created }
        '422': { description: Validation failed }
  /api/v1/services/contracts/{id}/status:
    post:
      operationId: setContractStatus
      summary: State-machine transition for a contract (requires services.contract.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/services/interventions:
    post:
      operationId: createIntervention
      summary: Schedule a field intervention (requires services.intervention.write)
      responses:
        '201': { description: Created }
        '422': { description: Validation failed }
  /api/v1/services/tickets:
    get:
      operationId: listTickets
      summary: Page tickets (requires services.ticket.read)
      responses:
        '200': { description: List }
    post:
      operationId: createTicket
      summary: Open a ticket (requires services.ticket.write)
      responses:
        '201': { description: Created }
        '422': { description: Validation failed }
  /api/v1/services/tickets/{id}/status:
    post:
      operationId: setTicketStatus
      summary: State-machine transition for a ticket (requires services.ticket.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/services/tickets/{id}/messages:
    get:
      operationId: listTicketMessages
      summary: List a ticket's messages (requires services.ticket.read)
      responses:
        '200': { description: List }
    post:
      operationId: addTicketMessage
      summary: Append a message to an open ticket (requires services.ticket.write)
      responses:
        '201': { description: Stored }
        '422': { description: Ticket closed or invalid }
  /api/v1/manufacturing/boms:
    get:
      operationId: listBOMs
      summary: Page bills of materials (requires manufacturing.bom.read)
      responses:
        '200': { description: List }
    post:
      operationId: createBOM
      summary: Open a draft BOM (requires manufacturing.bom.write)
      responses:
        '201': { description: Created }
        '409': { description: Duplicate ref }
        '422': { description: Validation failed }
  /api/v1/manufacturing/boms/{id}/lines:
    post:
      operationId: addBOMLine
      summary: Append a component line (requires manufacturing.bom.write)
      responses:
        '201': { description: Created }
        '422': { description: Self-reference, duplicate or frozen BOM }
  /api/v1/manufacturing/mos:
    get:
      operationId: listMOs
      summary: Page manufacturing orders (requires manufacturing.mo.read)
      responses:
        '200': { description: List }
    post:
      operationId: createMO
      summary: Open a draft manufacturing order (requires manufacturing.mo.write)
      responses:
        '201': { description: Created }
        '422': { description: Validation failed }
  /api/v1/manufacturing/mos/{id}/status:
    post:
      operationId: setMOStatus
      summary: State-machine transition for an MO (requires manufacturing.mo.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/manufacturing/mos/{id}/produce:
    post:
      operationId: produceMO
      summary: Consume components and receipt finished goods (requires manufacturing.mo.produce)
      responses:
        '200': { description: Produced with plan }
        '422': { description: Insufficient stock or wrong status }
  /api/v1/hr/leaves:
    get:
      operationId: listLeaves
      summary: Page leave requests, optionally by user (requires hr.leave.read)
      responses:
        '200': { description: List }
    post:
      operationId: createLeave
      summary: File a draft leave request (requires hr.leave.write)
      responses:
        '201': { description: Created }
        '422': { description: Validation failed }
  /api/v1/hr/leaves/{id}/status:
    post:
      operationId: setLeaveStatus
      summary: State-machine transition for a leave (requires hr.leave.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/hr/expenses:
    get:
      operationId: listExpenses
      summary: Page expense reports, optionally by user (requires hr.expense.read)
      responses:
        '200': { description: List }
    post:
      operationId: createExpense
      summary: Open a draft expense report (requires hr.expense.write)
      responses:
        '201': { description: Created }
        '409': { description: Duplicate ref }
        '422': { description: Validation failed }
  /api/v1/hr/expenses/{id}/lines:
    post:
      operationId: addExpenseLine
      summary: Append a line to a draft report (requires hr.expense.write)
      responses:
        '201': { description: Created }
        '422': { description: Report not editable }
  /api/v1/hr/expenses/{id}/pay:
    post:
      operationId: payExpense
      summary: Pay an approved report posting a balanced entry (requires hr.expense.pay)
      responses:
        '200': { description: Paid }
        '422': { description: Not approved or bad accounts }
        '502': { description: Ledger failed, reverted }
        '503': { description: Finance not wired }
  /api/v1/hr/salaries:
    get:
      operationId: listSalaries
      summary: List salary records, optionally by user (requires hr.salary.read)
      responses:
        '200': { description: List }
    post:
      operationId: createSalary
      summary: Record a draft salary (requires hr.salary.write)
      responses:
        '201': { description: Created }
        '422': { description: Unbalanced or invalid }
  /api/v1/pos/terminals:
    get:
      operationId: listTerminals
      summary: List tills (requires pos.terminal.read)
      responses:
        '200': { description: List }
    post:
      operationId: createTerminal
      summary: Register a till (requires pos.terminal.write)
      responses:
        '201': { description: Created }
        '409': { description: Duplicate code }
  /api/v1/pos/sessions:
    post:
      operationId: openSession
      summary: Open a cashier session (requires pos.session.write)
      responses:
        '201': { description: Opened }
        '422': { description: Terminal inactive }
  /api/v1/pos/sessions/{id}/close:
    post:
      operationId: closeSession
      summary: Close a cashier session (requires pos.session.validate)
      responses:
        '200': { description: Closed }
  /api/v1/pos/checkout:
    post:
      operationId: checkout
      summary: Ring a sale posting invoice, payment and stock moves (requires pos.sale.write)
      responses:
        '201': { description: Completed with change }
        '422': { description: Stock shortage, under-tender or closed session }
  /api/v1/pos/sessions/{id}/sales:
    get:
      operationId: sessionSales
      summary: List a session's till sales (requires pos.sale.read)
      responses:
        '200': { description: List }
  /api/v1/reports/pnl:
    get:
      operationId: profitAndLoss
      summary: P&L over posted entries (requires reporting.pnl.read)
      responses:
        '200': { description: Report }
  /api/v1/reports/receivables:
    get:
      operationId: receivables
      summary: Validated invoices with outstanding balances (requires reporting.receivables.read)
      responses:
        '200': { description: Report }
  /api/v1/reports/stock-valuation:
    get:
      operationId: stockValuation
      summary: PMP valuation for one warehouse (requires reporting.valuation.read)
      responses:
        '200': { description: Report }
        '400': { description: warehouse_id required }
  /api/v1/payments/intents:
    post:
      operationId: createPaymentIntent
      summary: Start a collection, manual settles at once (requires payments.attempt.write)
      responses:
        '201': { description: Created }
        '422': { description: Unknown provider or invalid }
  /api/v1/payments/attempts:
    get:
      operationId: listPaymentAttempts
      summary: Page payment attempts (requires payments.attempt.read)
      responses:
        '200': { description: List }
  /api/v1/payments/webhooks/stripe:
    post:
      operationId: stripeWebhook
      summary: Verified provider event, idempotent (HMAC credential, no RBAC)
      responses:
        '200': { description: Applied or duplicate }
        '401': { description: Bad signature }
        '503': { description: Webhook not configured }
  # --- Audit backfill: routes that existed but were missing from the spec ---
  /api/v1/users/{id}:
    get:
      operationId: getUser
      summary: Fetch one user (requires identity.user.read)
      responses:
        '200': { description: User }
        '404': { description: Not found }
  /api/v1/groups/{id}/members:
    post:
      operationId: addGroupMember
      summary: Add a user to a group (requires identity.group.write)
      responses:
        '200': { description: Added }
  /api/v1/organizations/{id}/contacts:
    get:
      operationId: listOrgContacts
      summary: List an organization's contacts (requires partners.contact.read)
      responses:
        '200': { description: List }
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Fetch one product (requires catalog.product.read)
      responses:
        '200': { description: Product }
        '404': { description: Not found }
  /api/v1/sales/documents/{id}:
    get:
      operationId: getSalesDocument
      summary: Fetch one commercial document (requires sales.document.read)
      responses:
        '200': { description: Document }
        '404': { description: Not found }
    put:
      operationId: updateSalesDocument
      summary: Replace a DRAFT document's lines (requires sales.document.write)
      responses:
        '200': { description: Updated }
        '422': { description: Not a draft or invalid lines }
  /api/v1/sales/documents/{id}/convert:
    post:
      operationId: convertSalesDocument
      summary: Clone a document into the next family (requires sales.document.write)
      responses:
        '201': { description: Converted }
  /api/v1/purchase/documents/{id}:
    get:
      operationId: getPurchaseDocument
      summary: Fetch one supplier document (requires procurement.document.read)
      responses:
        '200': { description: Document }
        '404': { description: Not found }
  /api/v1/purchase/documents/{id}/status:
    post:
      operationId: setPurchaseStatus
      summary: Supplier document transition (requires procurement.document.validate)
      responses:
        '200': { description: Updated }
  /api/v1/purchase/documents/{id}/convert:
    post:
      operationId: convertPurchaseDocument
      summary: Clone a supplier document forward (requires procurement.document.write)
      responses:
        '201': { description: Converted }
  /api/v1/finance/bank-accounts:
    post:
      operationId: createBankAccount
      summary: Open a bank account (requires finance.bank.write)
      responses:
        '201': { description: Created }
  /api/v1/finance/accounts:
    get:
      operationId: listAccounts
      summary: List the chart of accounts (requires finance.account.read)
      responses:
        '200': { description: List }
  /api/v1/finance/journals:
    post:
      operationId: createJournal
      summary: Create an accounting journal (requires finance.journal.write)
      responses:
        '201': { description: Created }
  /api/v1/finance/loans:
    post:
      operationId: createLoan
      summary: Record a loan with schedule (requires finance.loan.write)
      responses:
        '201': { description: Created }
  /api/v1/finance/bank-transactions/{id}/reconcile:
    post:
      operationId: reconcileBankTransaction
      summary: Mark a bank movement reconciled (requires finance.bank.validate)
      responses:
        '200': { description: Reconciled }
  /api/v1/documents/{id}/download:
    get:
      operationId: downloadDocument
      summary: Rights-gated file download (requires documents.file.read)
      responses:
        '200': { description: Bytes }
        '404': { description: Not found }
  /api/v1/services/projects/{id}:
    get:
      operationId: getProject
      summary: Fetch one project (requires services.project.read)
      responses:
        '200': { description: Project }
        '404': { description: Not found }
  /api/v1/services/projects/{id}/hours:
    get:
      operationId: projectHours
      summary: Booked hundredths for a project (requires services.time.read)
      responses:
        '200': { description: Hours }
  /api/v1/services/tasks/{id}/status:
    post:
      operationId: setTaskStatus
      summary: Task transition (requires services.task.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/services/tasks/{id}/hours:
    get:
      operationId: taskHours
      summary: Booked hundredths for a task (requires services.time.read)
      responses:
        '200': { description: Hours }
  /api/v1/services/organizations/{orgID}/contracts:
    get:
      operationId: contractsOfOrg
      summary: List an organization's contracts (requires services.contract.read)
      responses:
        '200': { description: List }
  /api/v1/services/interventions/{id}/status:
    post:
      operationId: setInterventionStatus
      summary: Intervention transition (requires services.intervention.validate)
      responses:
        '200': { description: Updated }
        '422': { description: Illegal transition }
  /api/v1/services/tickets/{id}:
    get:
      operationId: getTicket
      summary: Fetch one ticket (requires services.ticket.read)
      responses:
        '200': { description: Ticket }
        '404': { description: Not found }
  /api/v1/manufacturing/boms/{id}:
    get:
      operationId: getBOM
      summary: Fetch one BOM (requires manufacturing.bom.read)
      responses:
        '200': { description: BOM }
        '404': { description: Not found }
  /api/v1/manufacturing/boms/{id}/status:
    post:
      operationId: setBOMStatus
      summary: BOM transition (requires manufacturing.bom.validate)
      responses:
        '200': { description: Updated }
  /api/v1/manufacturing/mos/{id}:
    get:
      operationId: getMO
      summary: Fetch one manufacturing order (requires manufacturing.mo.read)
      responses:
        '200': { description: MO }
        '404': { description: Not found }
  /api/v1/manufacturing/mos/{id}/status:
    post:
      operationId: setMOStatus
      summary: MO transition (requires manufacturing.mo.validate)
      responses:
        '200': { description: Updated }
  /api/v1/hr/expenses/{id}/status:
    post:
      operationId: setExpenseStatus
      summary: Expense report transition (requires hr.expense.validate)
      responses:
        '200': { description: Updated }
  /api/v1/hr/salaries/{id}/status:
    post:
      operationId: setSalaryStatus
      summary: Salary transition (requires hr.salary.validate)
      responses:
        '200': { description: Updated }
  /api/v1/payments/attempts/{id}/status:
    post:
      operationId: setAttemptStatus
      summary: Settle or refund an attempt (requires payments.attempt.validate)
      responses:
        '200': { description: Updated }
  /api/v1/pos/sessions/{id}:
    get:
      operationId: getPOSSession
