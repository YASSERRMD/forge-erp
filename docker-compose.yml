name: forgeerp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forgeerp
      POSTGRES_PASSWORD: forgeerp
      POSTGRES_DB: forgeerp
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeerp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forgeerp
      MINIO_ROOT_PASSWORD: forgeerp123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: ["osdata:/usr/share/opensearch/data"]
    profiles: ["search"]

  keycloak:
    image: quay.io/keycloak/keycloak:24
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8081:8080"]
    profiles: ["identity"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    profiles: ["mail"]

  api:
    build:
      context: ./backend
    environment:
      FERP_ENV: development
      FERP_DATABASE_URL: postgres://forgeerp:forgeerp@postgres:5432/forgeerp?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  osdata:
